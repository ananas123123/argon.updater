name: Build Argon installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Argon app release tag (use latest or a tag such as v0.1.0)"
        required: true
        default: "latest"

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out installer repository
        uses: actions/checkout@v4

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer from Argon app release
        shell: powershell
        env:
          ARGON_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = $env:ARGON_RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "latest" }
          .\tools\Build-Installer.ps1 -ReleaseTag $tag

      - name: Upload installer and manifest
        uses: actions/upload-artifact@v4
        with:
          name: Argon-Windows-Installer
          path: |
            dist/output/ArgonInstaller-*-x64.exe
            dist/payload-manifest.json
          if-no-files-found: error
          retention-days: 14
